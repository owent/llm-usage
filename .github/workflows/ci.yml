name: CI

# Platform checks: docs/design/desktop-usage/platform-ci.md.
# Build portable x64/arm64 packages on all three platforms with read-only PR permissions.
# Tag pushes update a draft Release after all checks; artifacts record revision, size and digest.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  docs:
    name: Markdown / 文档检查
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:md

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: node scripts/assets.mjs --check
      - run: npm run build
      - run: node --test scripts/*.test.mjs
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        working-directory: .

  rust:
    name: ${{ matrix.os }} Rust fmt / clippy / test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-15]
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}
          workspaces: desktop/src-tauri
      - name: Linux Rust 检查所需系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf build-essential
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: runner.os == 'Linux'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Linux 原生隔离凭据验证
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y gnome-keyring dbus-x11
          npm run test:credentials:linux
        working-directory: .
      - name: macOS 原生凭据与 HTTP 撤销
        if: runner.os == 'macOS'
        run: |
          cargo test --locked receiver_auth::tests::native_credential_store_roundtrip -- --exact --ignored --nocapture
          cargo test --locked receiver_auth::tests::native_credential_http_revocation -- --exact --ignored --nocapture

  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }} portable release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
          - os: windows-11-arm
            platform: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            args: --no-bundle
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            args: --bundles appimage
          - os: macos-15-intel
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
            args: --bundles app
          - os: macos-15
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            args: --bundles app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.target }}-rust-${{ env.RUST_TOOLCHAIN }}
          workspaces: desktop/src-tauri
      - name: Linux WebKitGTK 等系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file zstd \
            webkit2gtk-driver xvfb xauth dbus-x11
      - name: Archive tools
        shell: bash
        run: |
          tar --version
          zstd --version
      - name: 前端安装与构建
        working-directory: desktop
        run: |
          npm ci
          node scripts/assets.mjs --check
          npm run check
          npm run build
      - name: Tauri release 构建
        working-directory: desktop
        run: npx tauri build --target ${{ matrix.target }} ${{ matrix.args }} -- --locked
      - name: Portable archive, extraction and native headless tests
        if: success()
        env:
          PORTABLE_GUI_CHECK: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: node desktop/scripts/portable.mjs desktop/src-tauri/target/${{ matrix.target }}/release build/release/${{ matrix.platform }}-${{ matrix.arch }} ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: llm-usage-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            build/release/${{ matrix.platform }}-${{ matrix.arch }}/*-portable.tar.zst
            build/release/${{ matrix.platform }}-${{ matrix.arch }}/*-setup.exe
            build/release/${{ matrix.platform }}-${{ matrix.arch }}/bundle-report.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft Release
    needs: [docs, frontend, rust, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !github.event.deleted
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: github-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: llm-usage-*-${{ github.sha }}
          path: build/github-release/artifacts
      - name: Verify packages and update draft metadata
        id: draft
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs/promises');
            const { createReadStream } = require('node:fs');
            const { createHash } = require('node:crypto');
            const path = require('node:path');
            const tag = context.ref.slice('refs/tags/'.length);
            const version = JSON.parse(await fs.readFile('package.json', 'utf8')).version;
            if (tag !== `v${version}`) throw new Error('Tag does not match the release version');
            const platforms = ['windows-x64', 'windows-arm64', 'linux-x64', 'linux-arm64', 'macos-x64', 'macos-arm64'];
            const assets = 'build/github-release/assets';
            await fs.mkdir(assets, { recursive: true });
            const names = new Set();
            for (const platform of platforms) {
              const root = path.resolve('build/github-release/artifacts', `llm-usage-${platform}-${context.sha}`);
              const reportPath = path.join(root, 'bundle-report.json');
              const report = JSON.parse(await fs.readFile(reportPath, 'utf8'));
              const [os, arch] = platform.split('-');
              const portableName = `LLMUsage-${version}-${platform}-portable.tar.zst`;
              if (report.revision !== context.sha || report.portable?.platform !== os || report.portable?.arch !== arch ||
                  report.portable?.version !== version || !report.portable?.extracted_verified || !report.portable?.headless_verified ||
                  (os === 'linux' && !report.portable?.gui_verified) ||
                  report.bundles?.filter(bundle => path.basename(bundle.path) === portableName).length !== 1 ||
                  report.bundles.length !== (platform === 'windows-x64' ? 2 : 1)) {
                throw new Error(`Missing packages or wrong revision: ${platform}`);
              }
              for (const bundle of report.bundles) {
                const source = path.resolve(root, bundle.path);
                const name = path.basename(source);
                const relative = path.relative(root, source);
                if (relative.startsWith('..') || path.isAbsolute(relative) ||
                    (name !== portableName && !(platform === 'windows-x64' && name === `LLMUsage_${version}_x64-setup.exe`)) ||
                    names.has(name.toLowerCase())) {
                  throw new Error(`Invalid or duplicate release package: ${bundle.path}`);
                }
                const hash = createHash('sha256');
                for await (const chunk of createReadStream(source)) hash.update(chunk);
                const bytes = (await fs.stat(source)).size;
                if (bytes <= 0 || bytes !== bundle.bytes || hash.digest('hex') !== bundle.sha256) {
                  throw new Error(`Package size or digest mismatch: ${name}`);
                }
                names.add(name.toLowerCase());
                await fs.copyFile(source, path.join(assets, name));
              }
              await fs.copyFile(reportPath, path.join(assets, `bundle-report-${platform}.json`));
            }
            let { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
            let object = ref.object;
            while (object.type === 'tag') {
              const { data } = await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha });
              object = data.object;
            }
            if (object.type !== 'commit' || object.sha !== context.sha) {
              throw new Error('Tag changed while building; refusing to upload an older revision');
            }
            const body = `Automated draft for ${tag}.\n\nSource commit: ${context.sha}\n` +
              `Build: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              'Portable .tar.zst archives for Windows, Linux and macOS, each in x64 and arm64; Windows x64 NSIS is also included.\n' +
              'Extract and run LLMUsage.exe (Windows), AppRun (Linux, no FUSE) or LLMUsage.app (macOS).\n' +
              'Windows requires system WebView2; Linux uses an Ubuntu 22.04/glibc 2.35 baseline and a desktop display.\n' +
              'The archives include runtime instructions; data and credentials retain their existing per-user storage.\n' +
              'Platform bundle reports contain package sizes and SHA-256 digests.\n' +
              'These CI packages do not establish signing, notarization or desktop installation acceptance.';
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const matches = releases.filter(release => release.tag_name === tag);
            if (matches.length > 1) throw new Error(`Multiple releases exist for ${tag}`);
            const metadata = { ...context.repo, tag_name: tag, target_commitish: context.sha,
              name: tag, body, draft: true, prerelease: false };
            const { data: release } = matches.length
              ? await github.rest.repos.updateRelease({ ...metadata, release_id: matches[0].id })
              : await github.rest.repos.createRelease(metadata);
            core.setOutput('release_id', release.id);
      - name: Upload all platform packages
        uses: xresloader/upload-to-github-release@7c5757a90c0bcf0c0e1741da8f2abd7b85e675d0 # v1
        with:
          file: build/github-release/assets/*
          release_id: ${{ steps.draft.outputs.release_id }}
          tag_name: ${{ github.ref_name }}
          tags: true
          draft: true
          overwrite: true
      - name: Verify uploaded assets
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const { createHash } = require('node:crypto');
            const release_id = Number(process.env.RELEASE_ID);
            const { data: release } = await github.rest.repos.getRelease({ ...context.repo, release_id });
            if (!release.draft || release.tag_name !== context.ref.slice('refs/tags/'.length) ||
                release.target_commitish !== context.sha) throw new Error('Release metadata mismatch');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...context.repo, release_id, per_page: 100 });
            for (const name of await fs.readdir('build/github-release/assets')) {
              const data = await fs.readFile(`build/github-release/assets/${name}`);
              const matches = assets.filter(asset => asset.name === name);
              const digest = `sha256:${createHash('sha256').update(data).digest('hex')}`;
              if (matches.length !== 1 || matches[0].state !== 'uploaded' ||
                  matches[0].size !== data.length || matches[0].digest !== digest) {
                throw new Error(`Uploaded asset missing or mismatched: ${name}`);
              }
            }
            core.notice(`Verified draft Release: ${release.html_url}`);
