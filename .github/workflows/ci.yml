name: CI

# 合同见 docs/design/desktop-usage/platform-ci.md：
# 三平台真实构建、fail-fast=false、Actions 使用 v 主版本号浮动引用、PR 只读权限、
# 不做发布/签名；制品记录 revision、大小与校验和。M1 起逐步加入 fixture 与集成测试。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  docs:
    name: Markdown / 文档检查
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:md

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: node scripts/assets.mjs --check
      - run: npm run build
      - run: node --test scripts/*.test.mjs
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        working-directory: .

  rust:
    name: Rust fmt / clippy / test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-x64-rust-${{ env.RUST_TOOLCHAIN }}
          workspaces: desktop/src-tauri
      - name: Linux Rust 检查所需系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf build-essential
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    name: ${{ matrix.os }} release 构建
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-15
            bundles: app
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}
          workspaces: desktop/src-tauri
      - name: Linux WebKitGTK 等系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file
      - name: 前端安装与构建
        working-directory: desktop
        run: |
          npm ci
          node scripts/assets.mjs --check
          npm run check
          npm run build
      - name: Tauri release 构建
        working-directory: desktop
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: 制品大小与校验和
        if: success()
        run: node desktop/scripts/bundle-report.mjs desktop/src-tauri/target/release/bundle
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: llm-usage-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            desktop/src-tauri/target/release/bundle/**
            !desktop/src-tauri/target/release/bundle/macos/*.app/**
          if-no-files-found: error
          retention-days: 14
