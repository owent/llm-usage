[package]
name = "llm-usage-desktop"
version = "0.1.0-dev.0"
description = "llm-usage desktop client"
edition = "2021"
rust-version = "1.77.2"

[workspace]
members = ["crates/core"]
# 根 package.json 的 cargo 命令不带 --workspace；默认成员须同时覆盖 app 与 core。
default-members = [".", "crates/core"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[[bin]]
name = "LLMUsage"
path = "src/main.rs"

[dependencies]
tauri = { version = "=2.11.6", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
llm-usage-core = { path = "crates/core" }
jiff = { version = "=0.2.37" }
rfd = { version = "=0.15.4" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
