[package]
name = "llm-usage-desktop"
version = "0.2.1"
description = "llm-usage desktop client"
edition = "2021"
rust-version = "1.89"

[workspace]
members = ["crates/core"]
# 根 package.json 的 cargo 命令不带 --workspace；默认成员须同时覆盖 app 与 core。
default-members = [".", "crates/core"]

[build-dependencies]
tauri-build = { version = "^2.7.0", features = [] }

[[bin]]
name = "LLMUsage"
path = "src/main.rs"

[dependencies]
tauri = { version = "^2.12.0", features = [] }
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = { version = "^1.0.151" }
rusqlite = { version = "^0.40.2", features = ["bundled"] }
llm-usage-core = { path = "crates/core" }
jiff = { version = "^0.2.37" }
rfd = { version = "^0.17.2" }
# fs4：备份前磁盘剩余空间检查（V15 迁移/清理前一致备份约定）。
fs4 = { version = "^0.13" }
# flate2：OTLP 接收器 gzip 解压（有界，V22 压缩炸弹防护）。
flate2 = { version = "^1" }
# Edit JSONC by value ranges; unrelated configuration and comments stay intact.
jsonc-parser = { version = "^0.34", features = ["serde"] }
toml_edit = { version = "^0.25", features = ["serde"] }
# ureq：F2 在线刷新 HTTPS GET models.dev api.json（rustls、无本地数据外发；响应体有界）。
ureq = "3.4.2"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
getrandom = "^0.3.4"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "^5.2.0", features = ["rt-tokio-crypto-rust"] }
tokio = { version = "^1", features = ["rt", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "^3.7.0"
security-framework-sys = "^2.17.0"
core-foundation = "^0.10"

[target.'cfg(windows)'.dependencies]
tauri = { version = "^2.12.0", features = ["tray-icon"] }
windows = { version = "^0.62.2", features = ["Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_Power", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Security_Cryptography"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
