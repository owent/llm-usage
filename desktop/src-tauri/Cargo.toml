[package]
name = "llm-usage-desktop"
version = "0.1.0-dev.1"
description = "llm-usage desktop client"
edition = "2021"
rust-version = "1.89"

[workspace]
members = ["crates/core"]
# 根 package.json 的 cargo 命令不带 --workspace；默认成员须同时覆盖 app 与 core。
default-members = [".", "crates/core"]

[build-dependencies]
tauri-build = { version = "^2.7.0", features = [] }

[[bin]]
name = "LLMUsage"
path = "src/main.rs"

[dependencies]
tauri = { version = "^2.12.0", features = [] }
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = { version = "^1.0.151" }
rusqlite = { version = "^0.40.2", features = ["bundled"] }
llm-usage-core = { path = "crates/core" }
jiff = { version = "^0.2.37" }
rfd = { version = "^0.17.2" }
# fs4：备份前磁盘剩余空间检查（V15 迁移/清理前一致备份合同）。
fs4 = { version = "^0.13" }
# flate2：OTLP 接收器 gzip 解压（有界，V22 压缩炸弹防护）。
flate2 = { version = "^1" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
