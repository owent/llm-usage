[package]
name = "llm-usage-core"
version = "0.2.0"
description = "Statistics core and SQLite storage for the llm-usage desktop client (M1)"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[dependencies]
# backup：SQLite Online Backup API（源库一致暂存副本，kilo 只读合同）。
rusqlite = { version = "^0.40.2", features = [
  "bundled",
  "backup",
  "functions",
] }
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = { version = "^1.0.151" }
jiff = { version = "^0.2.37" }
# zstd：Zed threads.db data blob（data_type="zstd"）有界解压（M8/A38）。
zstd = { version = "^0.13", default-features = false }

[dev-dependencies]
serde_json = { version = "^1.0.151" }
jiff = { version = "^0.2.37" }
rusqlite = { version = "^0.40.2", features = ["bundled", "backup"] }
