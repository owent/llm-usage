[package]
name = "llm-usage-core"
version = "0.5.4"
description = "Statistics core and SQLite storage for the llm-usage desktop client (M1)"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[dependencies]
# backup: SQLite Online Backup API for a consistent staged source copy; Kilo read-only source rules.
rusqlite = { version = "^0.43.0", features = [
  "bundled",
  "backup",
  "functions",
  "hooks",
] }
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = { version = "^1.0.154" }
jiff = { version = "^1.0.2" }
sha2 = { version = "^0.11.1" }
semver = "^1.0.28"
tar = "^0.4.46"
# zstd: bounded decompression of Zed threads.db data blobs (data_type="zstd", M8/A38).
zstd = { version = "^0.14.4", default-features = false }

[dev-dependencies]
serde_json = { version = "^1.0.154" }
jiff = { version = "^1.0.2" }
rusqlite = { version = "^0.43.0", features = ["bundled", "backup"] }
