[package]
name = "llm-usage-core"
version = "0.2.1"
description = "Statistics core and SQLite storage for the llm-usage desktop client (M1)"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[dependencies]
# backup: SQLite Online Backup API for a consistent staged source copy; Kilo read-only source rules.
rusqlite = { version = "^0.40.2", features = [
  "bundled",
  "backup",
  "functions",
  "hooks",
] }
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = { version = "^1.0.151" }
jiff = { version = "^0.2.37" }
# zstd: bounded decompression of Zed threads.db data blobs (data_type="zstd", M8/A38).
zstd = { version = "^0.13", default-features = false }

[dev-dependencies]
serde_json = { version = "^1.0.151" }
jiff = { version = "^0.2.37" }
rusqlite = { version = "^0.40.2", features = ["bundled", "backup"] }
